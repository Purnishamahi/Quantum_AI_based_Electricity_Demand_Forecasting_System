<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumGrid AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=premium2">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="{% block theme %}theme-home{% endblock %}">
<nav>
  <a class="brand" href="/">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3552b8"/><stop offset="1" stop-color="#7b4b94"/></linearGradient></defs>
      <circle cx="20" cy="20" r="15" fill="none" stroke="url(#lg)" stroke-width="2.5"/>
      <circle cx="20" cy="5" r="4" fill="#d6a044"/><circle cx="35" cy="20" r="4" fill="#c4596a"/>
      <circle cx="20" cy="35" r="4" fill="#2b8c80"/><circle cx="5" cy="20" r="4" fill="#3552b8"/>
    </svg>
    <span>Quantum<b>Grid</b> AI</span>
  </a>
  <div class="navlinks">
    <a href="/" class="{{ 'active' if request.path=='/' }}">Forecast</a>
    <a href="/day" class="{{ 'active' if request.path=='/day' }}">24 Hours</a>
    <a href="/week" class="{{ 'active' if request.path=='/week' }}">7 Days</a>
    <a href="/insights" class="{{ 'active' if request.path=='/insights' }}">Insights</a>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>QuantumGrid AI · <b>4-qubit VQC</b> electricity demand forecasting</footer>
<script src="/static/app.js?v=premium2"></script>
</body>
</html>
